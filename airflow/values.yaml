# Full template: https://github.com/apache/airflow/blob/main/chart/values.yaml

# Select certain nodes for airflow pods.
nodeSelector:
  agentpool: default

# Airflow executor
executor: "KubernetesExecutor"

# Environment variables for all airflow containers
env:
  - name: ENVIRONMENT
    value: dev

images:
  airflow:
    repository: tanmaysn.azurecr.io/airflow
    tag: v0.1.0
    pullPolicy: Always

extraEnv: |
  - name: AIRFLOW__CORE__DEFAULT_TIMEZONE
    value: 'Asia/Kolkata'
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: 'false'

# Configuration for postgresql subchart
# Not recommended for production! Instead, spin up your own Postgresql server and use the `data` attribute in this
# yaml file.
postgresql:
  enabled: true
  # Override the default PostgreSQL image with a valid tag
  # Visit https://hub.docker.com/r/bitnami/postgresql/tags to find available tags
  # Bitnami uses full version tags like "15.5.0-debian-12-r0" or "14.12.0-debian-12-r0"
  # Pick a tag from the Docker Hub page and replace "latest" below
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "latest"  # Replace with a specific tag from https://hub.docker.com/r/bitnami/postgresql/tags
    pullPolicy: IfNotPresent

# Enable pgbouncer. See https://airflow.apache.org/docs/helm-chart/stable/production-guide.html#pgbouncer
pgbouncer:
  enabled: true

dags:
  gitSync:
    enabled: true
    repo: git@github.com:tanmaysn/azure-airflow-kubernetes.git
    branch: main
    rev: HEAD
    depth: 1
    maxFailures: 0
    subPath: "dags"
    sshKeySecret: airflow-git-ssh-secret
    knownHosts: |
      github.com ssh-rsa 

logs:
  persistence:
    enabled: true
    existingClaim: pvc-airflow-logs
    storageClassName: azureblob-fuse-premium

# Enable webserver (traditional UI, separate from API server)
webserver:
  enabled: true

# We disable the log groomer sidecar because we use Azure Blob Storage for logs, with lifecyle policy set.
triggerer:
  logGroomerSidecar:
    enabled: false

scheduler:
  logGroomerSidecar:
    enabled: false

workers:
  logGroomerSidecar:
    enabled: false