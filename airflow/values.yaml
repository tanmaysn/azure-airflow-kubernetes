# Full template: https://github.com/apache/airflow/blob/main/chart/values.yaml

# Select certain nodes for airflow pods.
nodeSelector:
  agentpool: default

# Airflow executor - KubernetesExecutor runs each task in its own pod
executor: "KubernetesExecutor"

# Environment variables for all airflow containers
env:
  - name: ENVIRONMENT
    value: dev

images:
  airflow:
    repository: tanmaysn.azurecr.io/airflow
    tag: v0.1.4
    pullPolicy: Always

extraEnv: |
  - name: AIRFLOW__CORE__DEFAULT_TIMEZONE
    value: 'Asia/Kolkata'
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: 'false'
  # Performance optimizations for KubernetesExecutor
  - name: AIRFLOW__KUBERNETES_EXECUTOR__KUBE_CLIENT_REQUEST_TIMEOUT
    value: "60"  # Increase timeout for pod creation (seconds)
  - name: AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS
    value: "true"  # Clean up completed pods
  - name: AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS_ON_FAILURE
    value: "true"  # Clean up failed pods
  # Concurrency settings for better task execution
  - name: AIRFLOW__CORE__PARALLELISM
    value: "50"  # Maximum number of tasks that can run simultaneously
  - name: AIRFLOW__CORE__DAG_CONCURRENCY
    value: "20"  # Maximum number of tasks per DAG that can run simultaneously
  - name: AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG
    value: "10"  # Maximum number of active DAG runs per DAG

# Configuration for postgresql subchart
# Not recommended for production! Instead, spin up your own Postgresql server and use the `data` attribute in this
# yaml file.
postgresql:
  enabled: true
  # Override the default PostgreSQL image with a valid tag
  # Visit https://hub.docker.com/r/bitnami/postgresql/tags to find available tags
  # Bitnami uses full version tags like "15.5.0-debian-12-r0" or "14.12.0-debian-12-r0"
  # Pick a tag from the Docker Hub page and replace "latest" below
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "latest"  # Replace with a specific tag from https://hub.docker.com/r/bitnami/postgresql/tags
    pullPolicy: IfNotPresent

# Enable pgbouncer. See https://airflow.apache.org/docs/helm-chart/stable/production-guide.html#pgbouncer
pgbouncer:
  enabled: true

dags:
  gitSync:
    enabled: true
    repo: git@github.com:tanmaysn/azure-airflow-kubernetes.git
    branch: main
    rev: HEAD
    depth: 1
    maxFailures: 0
    subPath: "dags"
    sshKeySecret: airflow-git-ssh-secret
    knownHosts: |
      github.com ssh-rsa 

logs:
  persistence:
    enabled: true
    existingClaim: pvc-airflow-logs
    storageClassName: azureblob-fuse-premium

# Enable webserver (traditional UI, separate from API server)
webserver:
  enabled: true

# We disable the log groomer sidecar because we use Azure Blob Storage for logs, with lifecyle policy set.
triggerer:
  logGroomerSidecar:
    enabled: false

# Scheduler configuration for better performance
scheduler:
  logGroomerSidecar:
    enabled: false
  # Scheduler resources - optimized for OCR workload
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  # Increase scheduler parsing interval for better performance
  # This reduces CPU usage from constant DAG parsing
  extraEnv:
    - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
      value: "300"  # Parse DAGs every 5 minutes instead of default 30 seconds
    - name: AIRFLOW__SCHEDULER__MAX_THREADS
      value: "2"    # Number of threads for scheduling tasks

# DAG Processor configuration - optimized for performance
dagProcessor:
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  # Reduce DAG parsing frequency to improve performance
  extraEnv:
    - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
      value: "300"  # Parse DAGs every 5 minutes

# Worker resources for KubernetesExecutor pods
# With KubernetesExecutor, each task runs in its own pod
# These resources apply to task execution pods
workers:
  logGroomerSidecar:
    enabled: false
  # Resource limits for KubernetesExecutor task pods
  # OCR tasks are CPU and memory intensive, so allocate sufficient resources
  resources:
    limits:
      cpu: "2"      # 2 CPU cores per task pod (for OCR processing)
      memory: "4Gi" # 4GB memory per task pod (for PDF/image processing)
    requests:
      cpu: "1"      # Request 1 CPU core (guaranteed minimum)
      memory: "2Gi" # Request 2GB memory (guaranteed minimum)